name: publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options: [next, latest]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    # Select an existing vX.Y.Z git tag when dispatching, never a branch or PR.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: rayner-package-${{ github.sha }}
          path: out/release/
      - name: Verify tested archive and publish
        env:
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: node tools/publish-release.ts
