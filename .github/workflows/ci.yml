name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04  # the pinned image the embed tests were validated on
    timeout-minutes: 25  # full suite, browser gates, every demo case and video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # diagram capture and the embed tests run in headless Chromium (tools/lib/browser.ts)
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run check          # tsc -b over every project (emits dist/); compile a TS consumer against it
      - run: npm run test:full      # every frame, fast-check properties at ten times the default cases, cache validation, golden trace, leaks
      # Product gates reuse this job and its Chromium installation; no scheduled lane.
      - run: npm run test:embeds    # real origin/source isolation, offline/no-JS reading and style fidelity
      - run: npm run demos:check    # every explainer case: seek, motion, hold, bare runtime, readable labels, and captions that fit the video footer
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:video     # tiny real H.264/VP9 exports, not the full demo video batch
      - run: EXPLAIN_BROWSER=1 EXPLAIN_VIDEO=1 npm run pack:smoke  # packed archive in a fresh project: CLI, check, build, diagram capture, video
      # The review serves what demos:check built; one small video is enough for its byte-range check.
      - run: node tools/explain.ts render scenes/explainers/exgit --width 320 --fps 4 --out out/videos/exgit.mp4
      - run: npm run demos:review   # every served case at phone and desktop width, headers, video ranges, two embeds on one page
