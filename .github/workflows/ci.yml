name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04  # the pinned image the embed tests were validated on
    timeout-minutes: 25  # full suite, browser gates, every demo case and video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # diagram capture and the embed tests run in headless Chromium (tools/lib/browser.ts)
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run check          # tsc -b over every project (emits dist/); compile a TS consumer against it
      - run: npm run test:full      # every frame, fast-check properties at ten times the default cases, cache validation, golden trace, leaks
      - run: node --expose-gc test/leak.test.ts # also run directly, outside the test runner's workers
      # Product gates reuse this job and its Chromium installation; no scheduled lane.
      - run: npm run test:embeds    # real origin/source isolation, offline/no-JS reading and style fidelity
      - run: npm run demos:check    # every explainer case: seek, motion, bare runtime and readable labels
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:video     # tiny real H.264/VP9 exports, not the full demo video batch
