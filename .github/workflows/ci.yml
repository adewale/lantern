name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04  # the pinned image the embed tests were validated on
    timeout-minutes: 60  # full suite, browser gates and installed capture; catalog/story run separately
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the fork explainer's test reads Lantern's code at the fork base
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # diagram capture and the embed tests run in headless Chromium (tools/lib/browser.ts)
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-lmodern
          python3 -m venv out/lettering-venv
          out/lettering-venv/bin/pip install -r tools/lettering-requirements.txt
          bash tools/lettering-outline-fonts.sh
          echo "RAYNER_LETTERING_PYTHON=$PWD/out/lettering-venv/bin/python" >> "$GITHUB_ENV"
      - name: Check lettering capture and playback
        run: |
          set +e
          EXPLAIN_LETTERING=1 EXPLAIN_BROWSER=1 node --test --test-reporter=spec test/lettering-cache.test.ts test/lettering-outlines.test.ts test/lettering-styles.test.ts test/lettering-rtl.test.ts test/lettering-*-audit.test.ts > out/lettering-tests.log 2>&1
          lettering_status=$?
          cat out/lettering-tests.log
          if [ "$lettering_status" -ne 0 ]; then
            node --input-type=module -e 'import {readFileSync} from "node:fs"; const log=readFileSync("out/lettering-tests.log","utf8"), at=log.lastIndexOf("✖ failing tests:"), text=(at<0?log.slice(-16000):log.slice(at,at+16000)).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"); console.log("::error title=Lettering tests failed::"+text);'
          fi
          exit "$lettering_status"
      - run: npm run check          # tsc -b over every project (emits dist/); compile a TS consumer against it
      - run: npm run test:full      # every frame, fast-check properties at ten times the default cases, cache validation, golden trace, leaks
      # Product gates reuse this job and its Chromium installation; no scheduled lane.
      - run: npm run test:embeds    # real origin/source isolation, offline/no-JS reading and style fidelity
      - run: EXPLAIN_BROWSER=1 EXPLAIN_LETTERING=1 npm run release:check  # retain the exact tested archive
      - uses: actions/upload-artifact@v4
        with:
          name: rayner-package-${{ github.sha }}
          path: out/release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true  # a re-run of a failed job uploads again under the same name

  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run demos:check
      - uses: actions/upload-artifact@v4
        with:
          name: rayner-catalog-${{ github.sha }}
          path: out/explainers/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  story-part:
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright-core install --with-deps --only-shell chromium
      - uses: actions/download-artifact@v4
        with:
          name: rayner-catalog-${{ github.sha }}
          path: out/explainers/
      - run: npm run demos:review -- --shard ${{ matrix.part }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rayner-story-${{ github.sha }}-${{ matrix.part }}
          path: |
            out/review/shard-${{ matrix.part }}-of-3/
            out/validation/browser-review-shard-${{ matrix.part }}-of-3.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  story:
    if: always()  # a failed/missing shard must fail this required check, not skip it
    needs: [catalog, story-part]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the catalog and every story shard to pass
        env:
          CATALOG_RESULT: ${{ needs.catalog.result }}
          STORY_RESULT: ${{ needs['story-part'].result }}
        run: test "$CATALOG_RESULT" = success && test "$STORY_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rayner-catalog-${{ github.sha }}
          path: out/explainers/
      - uses: actions/download-artifact@v4
        with:
          pattern: rayner-story-${{ github.sha }}-*
          merge-multiple: true
          path: out/
      - run: node tools/explain-review-merge.ts
      - uses: actions/upload-artifact@v4
        with:
          name: rayner-story-${{ github.sha }}
          path: out/validation/browser-review.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        # Current standard ARM image; macos-15 ARM jobs failed to acquire runners.
        os: [ubuntu-24.04, macos-26, macos-15-intel]
        node: [24.0.0, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # types, standard suite, browser checks and installed starter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # retain the fork-base source oracle on every platform
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm test
      - run: npm run test:embeds
      - run: EXPLAIN_BROWSER=1 npm run pack:smoke  # installed starter preview on Linux and both Mac architectures
