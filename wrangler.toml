name = "lantern"
main = "app/worker.ts"
compatibility_date = "2025-06-01"

# The player page. Build it with `npm run build` (writes out/site/index.html).
# "/" runs the Worker first: it serves the page to browsers and /llms.txt text to everyone else.
[assets]
directory = "out/site"
binding = "ASSETS"
run_worker_first = ["/"]
